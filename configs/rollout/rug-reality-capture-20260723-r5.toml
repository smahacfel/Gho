# Full-universe, observe-only Pump tape. R5 replaces the invalid R4 segment:
# raw AccountUpdate reserves may supplement a CPI trade only after the exact
# `(slot, bonding_curve, virtual_sol, virtual_token)` join in the durable writer.
# No reducer, lifecycle, build, submission, simulation or live execution is enabled.

mode = "production"
ghost_brain_config_path = "../../ghost-brain/ghost_brain_config.toml"

[seer]
enabled = true
source_mode = "grpc"
commitment = "processed"
stream_mode = "single_global"
tx_filter_strategy = "per_pool"
funding_lane_mode = "disabled"
grpc_endpoint = "${GHOST_SEER_GRPC_ENDPOINT}"
grpc_x_token = "${GHOST_SEER_GRPC_X_TOKEN}"
grpc_auth_header = "x-api-key"
rpc_endpoint = "${GHOST_SEER_RPC_ENDPOINT}"
enable_pumpfun = true
enable_bonkfun = false
enable_raydium = false

[trigger]
enabled = false
rpc_url = "${GHOST_TRIGGER_RPC_URL}"
entry_mode = "shadow_only"
max_concurrent_positions = 1
max_position_size_sol = 0.10
emergency_floor_sol = 0.0001
position_size_buffer_sol = 0.0001
slippage_tolerance = 0.20

[trigger.shadow_run]
# This shared launcher surface remains inert because trigger.enabled=false.
enabled = true
payer_strategy = "ephemeral"
shadow_rpc_url = "${GHOST_TRIGGER_SHADOW_RPC_URL}"
commitment = "processed"
sig_verify = false
replace_recent_blockhash = true
timeout_ms = 1600
max_retries = 1
max_concurrent = 1
output_path = "/root/Gho_dynamic_exit_v1_pr2b/logs/rug_reality_capture/r5/disabled_shadow_entries.jsonl"
emit_event_bus = false

[execution]
execution_mode = "shadow"

[execution.shadow]
tx_build_compensation_ms = 250
max_quote_age_ms = 1500
entry_log_path = "/root/Gho_dynamic_exit_v1_pr2b/logs/rug_reality_capture/r5/disabled_shadow_entries.jsonl"
lifecycle_log_path = "/root/Gho_dynamic_exit_v1_pr2b/logs/rug_reality_capture/r5/disabled_shadow_lifecycle.jsonl"
timing_model = "prepared_entry_mirror"
stale_policy = "emit_warning"

[execution.events]
output_dir = "/root/Gho_dynamic_exit_v1_pr2b/datasets/events/rug_reality_capture/r5"
rotation_interval_ms = 300000
flush_interval_ms = 1000
max_file_size_bytes = 50000000
enable_aem_ticks = true
enable_optional_events = false

[p37_shadow_probe]
enabled = false

[rug_scalp_v2]
enabled = false

[rug_reality_capture]
enabled = true
run_id = "rug-reality-capture-20260723-r5"
manifest_path = "/root/Gho_dynamic_exit_v1_pr2b/logs/rug_reality_capture/r5/run_manifest_v1.json"
# SHA-256 over the base HEAD and source set documented by the ADR.
code_hash = "source-tree:sha256:11b4bf89f878028146c406d8e6ed93c39b16bb50861fdbeef78b7e3fd5981d51"

[rug_reality_capture.cost_profile]
profile_id = "current-pump-shadow-execution-policy-20260723"
entry_compute_unit_limit = 400000
entry_compute_unit_price_micro_lamports = 25000
exit_compute_unit_limit = 400000
exit_compute_unit_price_micro_lamports = 50000
tip_policy_id = "entry_helius_sender_baseline_1000000__exit_legacy_jito_300000"
ata_policy_id = "create_standard_spl_ata_if_missing__retain_no_close_refund__rent_165_bytes_at_manifest_start"
retry_policy_id = "first_attempt_cost_only__no_retry_cost_amortisation__failed_retry_cost_recorded_separately"
quote_age_policy_ms = 1500

[rug_reality_capture.cost_profile.entry_transaction_costs]
base_fee_lamports = 5000
priority_fee_lamports = 10000
jito_tip_lamports = 1000000
ata_rent_lamports = 2039280
ata_close_refund_lamports = 0
retry_or_failure_cost_lamports = 0

[rug_reality_capture.cost_profile.exit_transaction_costs]
base_fee_lamports = 5000
priority_fee_lamports = 20000
jito_tip_lamports = 300000
ata_rent_lamports = 0
ata_close_refund_lamports = 0
retry_or_failure_cost_lamports = 0

[account_state_core]
enable = true

[durability]
wal_enabled = false

[metrics]
enabled = false

[gui_backend]
enabled = false
bind_address = "127.0.0.1"
port = 8848

[logging]
level = "info"
console_enabled = true
json_format = false
file_enabled = true
file_path = "/root/Gho_dynamic_exit_v1_pr2b/logs/rug_reality_capture/r5/system.log"
oracle_log_enabled = true
oracle_log_path = "/root/Gho_dynamic_exit_v1_pr2b/logs/rug_reality_capture/r5/oracle.log"
oracle_json_format = false
