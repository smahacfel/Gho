# Prospective Pump Exact-State Tape V2 — operator template only.
#
# This file intentionally contains no usable endpoint, hostname, credential, or
# historical GO-D path.  Copy it to a private 0600 operator location, replace
# the .invalid endpoints, and choose a dedicated existing 0700 output root on
# a filesystem sized for `max_raw_bytes + min_free_bytes`.
#
# This is a new prospective source contract.  It never repairs, appends to, or
# reinterprets frozen GO-D.  A raw-complete V2 run remains distinct from the
# later offline exact-state qualification and from any strategy outcome gate.

primary_provider_id = "replace-with-source-provider-id"
grpc_endpoint = "https://replace-grpc-endpoint.invalid"
grpc_auth_token_env = "PUMP_EXACT_STATE_TAPE_V2_GRPC_TOKEN"
grpc_auth_header = "x-token"

# The same prospective source operator must provide a finalized,
# source-provider bootstrap snapshot.  This is not GO-E and cannot backfill
# or repair a historical tape.
bootstrap_rpc_endpoint = "https://replace-finalized-bootstrap-rpc.invalid"
bootstrap_rpc_auth_token_env = "PUMP_EXACT_STATE_TAPE_V2_BOOTSTRAP_RPC_TOKEN"
bootstrap_rpc_auth_header = "x-api-key"

# Exact compiled Pump program ID.  The binary rejects a substituted value.
pump_program_id = "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"

# Must exist before preflight, be a private non-symlink directory (0700), and
# be outside every V1/V2 raw run.  The capture creates a new child run only.
output_dir = "/protected/operator/pump-exact-state-tape-v2-runs"
required_for_run = true

# Bounded source ingress.  V2 receives unfiltered full blocks in addition to
# the Pump-filtered transaction and all-Pump-owned account lanes, so both item
# and serialized-protobuf-byte limits are authority inputs.
source_queue_capacity = 8192
source_queue_max_bytes = 536870912
bootstrap_queue_capacity = 4096
bootstrap_enqueue_timeout_ms = 30000
stream_establish_timeout_ms = 30000
bootstrap_rpc_timeout_ms = 300000
bootstrap_response_max_bytes = 536870912

# A finite prospective cohort begins only after the finalized bootstrap and
# sealed readiness boundary.  Deadline expiry is a deliberate normal stop;
# an unexpected source exit, source epoch change, gap, queue overflow, raw
# byte-budget breach, or storage-reserve breach makes the run incomplete.
cohort_capture_wall_ms = 3600000

# Preflight requires at least min_free_bytes + max_raw_bytes + a fixed 64 MiB
# metadata allowance to be available on this filesystem before any provider
# connection.  The writer periodically verifies the retained floor and refuses
# to persist more than max_raw_bytes.
min_free_bytes = 14000000000
max_raw_bytes = 16000000000

flush_interval_ms = 1000
segment_max_bytes = 268435456
segment_max_duration_ms = 300000
